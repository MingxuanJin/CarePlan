<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Plan Generator</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Care Plan Generator</h1>

        <form id="orderForm">
            <div class="section-title">Patient Information</div>

            <div class="form-group">
                <label for="patient_first_name">First Name *</label>
                <input type="text" id="patient_first_name" required>
            </div>

            <div class="form-group">
                <label for="patient_last_name">Last Name *</label>
                <input type="text" id="patient_last_name" required>
            </div>

            <div class="form-group">
                <label for="patient_mrn">MRN (6-digit) *</label>
                <input type="text" id="patient_mrn" required>
            </div>

            <div class="section-title">Provider Information</div>

            <div class="form-group">
                <label for="provider_name">Provider Name *</label>
                <input type="text" id="provider_name" required>
            </div>

            <div class="form-group">
                <label for="provider_npi">Provider NPI (10-digit) *</label>
                <input type="text" id="provider_npi" required>
            </div>

            <div class="section-title">Diagnosis & Medication</div>

            <div class="form-group">
                <label for="primary_diagnosis">Primary Diagnosis (ICD-10) *</label>
                <input type="text" id="primary_diagnosis" placeholder="e.g., E11.9" required>
            </div>

            <div class="form-group">
                <label>Additional Diagnoses (ICD-10)</label>
                <div class="list-input">
                    <input type="text" id="additional_diagnosis_input" placeholder="Enter ICD-10 code">
                    <button type="button" class="btn" data-add="additional_diagnoses">Add</button>
                </div>
                <div class="list-items" id="additional_diagnoses_list"></div>
            </div>

            <div class="form-group">
                <label for="medication_name">Medication Name *</label>
                <input type="text" id="medication_name" required>
            </div>

            <div class="form-group">
                <label>Medication History</label>
                <div class="list-input">
                    <input type="text" id="medication_history_input" placeholder="Enter medication history item">
                    <button type="button" class="btn" data-add="medication_history">Add</button>
                </div>
                <div class="list-items" id="medication_history_list"></div>
            </div>

            <div class="form-group">
                <label for="patient_records">Patient Records</label>
                <textarea id="patient_records" placeholder="Enter any additional patient records or notes"></textarea>
            </div>

            <button type="submit" class="btn" id="submitBtn">Generate Care Plan</button>
        </form>

        <div class="loading" id="loading">
            Generating care plan... This may take a moment.
        </div>

        <div class="care-plan-result" id="carePlanResult"></div>

        <button class="btn btn-secondary" id="downloadBtn" style="display:none;margin-top:10px;">
            Download Care Plan
        </button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
