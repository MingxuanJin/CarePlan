<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Care Plan Generator</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <h1>Care Plan Generator</h1>
      <p>Submit one medication order and wait for the LLM to generate a care plan.</p>

      <form id="care-plan-form">
        <div class="grid">
          <div>
            <label for="patient_first_name">Patient first name</label>
            <input id="patient_first_name" name="patient_first_name">
          </div>

          <div>
            <label for="patient_last_name">Patient last name</label>
            <input id="patient_last_name" name="patient_last_name">
          </div>

          <div>
            <label for="patient_mrn">Patient MRN</label>
            <input id="patient_mrn" name="patient_mrn">
          </div>

          <div>
            <label for="provider_name">Provider name</label>
            <input id="provider_name" name="provider_name">
          </div>

          <div>
            <label for="provider_npi">Provider NPI</label>
            <input id="provider_npi" name="provider_npi">
          </div>

          <div>
            <label for="primary_diagnosis">Primary diagnosis</label>
            <input id="primary_diagnosis" name="primary_diagnosis">
          </div>

          <div class="full">
            <label for="additional_diagnoses">Additional diagnoses</label>
            <textarea id="additional_diagnoses" name="additional_diagnoses"></textarea>
          </div>

          <div class="full">
            <label for="medication_name">Medication name</label>
            <input id="medication_name" name="medication_name">
          </div>

          <div class="full">
            <label for="medication_history">Medication history</label>
            <textarea id="medication_history" name="medication_history"></textarea>
          </div>

          <div class="full">
            <label for="patient_records">Patient records</label>
            <textarea id="patient_records" name="patient_records"></textarea>
          </div>
        </div>

        <button id="submit-button" type="submit">Generate care plan</button>
      </form>

      <section id="result" class="result hidden">
        <h2>Generated Care Plan</h2>
        <dl>
          <dt>Patient</dt>
          <dd id="result-patient"></dd>
          <dt>MRN</dt>
          <dd id="result-mrn"></dd>
          <dt>Provider</dt>
          <dd id="result-provider"></dd>
          <dt>Medication</dt>
          <dd id="result-medication"></dd>
          <dt>Diagnosis</dt>
          <dd id="result-diagnosis"></dd>
        </dl>
        <pre id="care-plan-text"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
